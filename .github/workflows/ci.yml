name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        # BOA_SHEET_ID is optional here — without it the build still succeeds
        # and sheet-driven sections render empty. Add it as a repo secret
        # (Settings → Secrets and variables → Actions) for a full-data build.
        env:
          BOA_SHEET_ID: ${{ secrets.BOA_SHEET_ID }}
        run: npm run build
