name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # rebuild every 6 hours so Google Sheet edits reach the static site
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export (CI-only source tweak)
        run: node scripts/prepare-static-export.mjs

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          # add BOA_SHEET_ID under Settings → Secrets and variables → Actions
          BOA_SHEET_ID: ${{ secrets.BOA_SHEET_ID }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
